# ============================================================================
# 玄枢・AURUM · nginx 网关
# 挂载点：/etc/nginx/conf.d/default.conf（由 compose 的 web 服务挂入）
# 该文件被 include 在 nginx 的 http{} 上下文里，因此 map / upstream 可写在顶层。
#
# 职责：
#   1) 托管 web/dist 静态资源（history 路由回退 index.html）
#   2) /api 反代到 api:8787，含 WebSocket Upgrade 升级头
#   3) SSE（/api/v1/agents/runs/:id/stream）关闭缓冲，事件逐条实时下发
#   4) 512m 大文件上传（台本/参考图/参考音频/成片回传）
# ============================================================================

# WebSocket：只有真正带 Upgrade 的请求才透传 upgrade，普通 API 请求保持 keep-alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream aurum_api {
    server api:8787;
    keepalive 32;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 大文件上传：单个请求体上限 512m --------------------------------
    client_max_body_size    512m;
    client_body_buffer_size 1m;
    client_body_timeout     300s;

    # ---- 基础安全头 -----------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        same-origin always;

    # ---- 压缩 -----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/markdown application/json
                      application/javascript application/xml image/svg+xml;

    # ---- 探活（给负载均衡/宿主机体检用，不经过中台） --------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # ---- REST + WebSocket 反代 -----------------------------------------
    # proxy_pass 不带 URI，保留原始 /api/... 路径：/api/v1/health -> api:8787/api/v1/health
    location /api/ {
        proxy_pass         http://aurum_api;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket /ws 升级
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # SSE 关闭缓冲：agents/stream 每 500ms 推一帧，缓冲会让前端整段卡住
        proxy_buffering       off;
        proxy_cache           off;
        proxy_request_buffering off;

        # 渲染提交、长轮询 pull（wait=30s）、SSE（最长 120s）都靠这个超时
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 15s;
    }

    # ---- 中台托管的素材文件（storageDir，prefix=/files/） ----------------
    location /files/ {
        proxy_pass       http://aurum_api;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 成片动辄几百 MB，边下边传，不落盘缓冲
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # ---- 前端构建产物长缓存 --------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|svg|ico|mp4|webm|wav|mp3)$ {
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
        try_files  $uri =404;
    }

    # ---- index.html 不缓存，保证发版后立即生效 --------------------------
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- SPA 路由回退 ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
