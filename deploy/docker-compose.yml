# ============================================================================
# 玄枢・AURUM · 生产编排（deploy/docker-compose.yml）
# ----------------------------------------------------------------------------
# 本编排只包含「控制面 + 存储 + 网关」四类容器：
#   postgres(16) 业务库（可选，默认走内嵌 SQLite）
#   redis(7)     队列/缓存/限流计数
#   minio        对象存储（S3 兼容，console 9001）
#   api          业务中台（Fastify + node:sqlite，8787）
#   web          nginx:alpine 托管 web/dist，8080，反代 /api 并支持 WebSocket
#
# 【GPU 节点不进 compose】ComfyUI（H3 本地渲染）/ TTS Worker（IndexTTS-2）/
# lip-sync（MuseTalk）三者必须直接跑在 GPU 物理机上，以裸进程 + systemd 托管：
#   - 它们要独占显存、要按模型常驻（加载一次跑整批），容器化会让显存回收与
#     模型热切换变得不可控，且 CUDA 驱动版本必须与宿主一致；
#   - 它们与中台之间是「反向拉取」关系：节点主动 POST /api/v1/agent/heartbeat、
#     GET /api/v1/agent/tasks/pull（长轮询 30s），因此节点只需能访问本文件的
#     api:8787，不需要被 compose 编排；
#   - 接入步骤见 deploy/README.md「GPU 节点接入」章节。
#
# 用法：
#   cp deploy/.env.example deploy/.env   # 按需改
#   cd deploy && docker compose up -d --build
#   curl http://127.0.0.1:8787/api/v1/health
# ============================================================================

name: aurum-stage

# 统一日志轮转，避免 GPU/渲染日志把磁盘写满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # --------------------------------------------------------------------------
  # 业务库（可选）：默认使用 services/api/.data/aurum.db 内嵌 SQLite，
  # 只有当 .env 里 DATABASE_URL=postgresql://... 时才切到 PG。
  # 不想要 PG：直接 docker compose up -d api web redis minio
  # （单独指定服务名即不会拉起 postgres）。
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: aurum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurum_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-aurum}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-aurum} -d ${POSTGRES_DB:-aurum}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  # --------------------------------------------------------------------------
  # 队列 / 缓存：调度器限流计数、SSE 事件广播的进程内补充、幂等键缓存
  # --------------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: aurum-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # --------------------------------------------------------------------------
  # 对象存储：视频/音频/字幕/封面，桶名默认 aurum，控制台 9001
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: aurum-minio
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aurum}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aurum_dev_minio_pwd}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9001}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 控制台
    logging: *default-logging

  # --------------------------------------------------------------------------
  # 业务中台：Fastify + node:sqlite，托管 /api/v1 REST + /api/v1/ws + /files 静态
  # --------------------------------------------------------------------------
  api:
    build:
      # 构建上下文必须是仓库根：services/api 依赖 workspace 包 @aurum/core，
      # 只用 ./services/api 做上下文会在 pnpm install 阶段断链。
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: aurum-stage/api:1.0.0
    container_name: aurum-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AURUM_HOST: 0.0.0.0
      AURUM_PORT: "8787"
      AURUM_DATA_DIR: /data
      AURUM_WEB_DIST: /app/web/dist
      AGENT_TOKEN: ${AGENT_TOKEN:-aurum-dev-agent-token}
      TZ: Asia/Shanghai
    ports:
      - "8787:8787"
    volumes:
      - aurum-data:/data # SQLite / 本地对象存储 / 导出产物
      - ${NFS_HOST_ROOT:-./nfs}:/nfs # 与 GPU 节点共享的中间产物目录
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  # --------------------------------------------------------------------------
  # 前端网关：nginx:alpine 直接托管 web/dist（先 pnpm --filter @aurum/web build），
  # /api 反代到 api:8787，含 WebSocket 升级与 SSE 关闭缓冲（见 deploy/nginx.conf）
  # --------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: aurum-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    logging: *default-logging

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
  aurum-data:
    driver: local
